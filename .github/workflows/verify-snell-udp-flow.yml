name: Verify proxy UDP flow adapters

on:
  workflow_dispatch:
  push:
    paths:
      - "common/udpflow/**"
      - "option/snell.go"
      - "option/vless.go"
      - "protocol/snell/**"
      - "protocol/vless/**"
      - ".github/workflows/verify-snell-udp-flow.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "common/udpflow/**"
      - "option/snell.go"
      - "option/vless.go"
      - "protocol/snell/**"
      - "protocol/vless/**"
      - ".github/workflows/verify-snell-udp-flow.yml"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test UDP flow adapters with race detection
        run: go test -race -count=1 ./common/udpflow ./protocol/snell ./protocol/vless

      - name: Test with gVisor enabled
        run: go test -tags with_gvisor -count=1 ./common/udpflow ./protocol/snell ./protocol/vless

      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/sing-box-linux-amd64 ./cmd/sing-box
          ./dist/sing-box-linux-amd64 version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64-proxy-udp-flow-go-${{ matrix.go }}
          path: dist/sing-box-linux-amd64
          if-no-files-found: error
