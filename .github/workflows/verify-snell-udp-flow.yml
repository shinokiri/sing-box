name: Verify proxy UDP flow adapters

on:
  workflow_dispatch:
  push:
    paths:
      - "common/udpflow/**"
      - "option/snell.go"
      - "option/vless.go"
      - "protocol/snell/**"
      - "protocol/vless/**"
      - ".github/workflows/verify-snell-udp-flow.yml"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test UDP flow adapters
        run: go test ./common/udpflow ./protocol/snell ./protocol/vless

      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -o dist/sing-box-linux-amd64 ./cmd/sing-box
          ./dist/sing-box-linux-amd64 version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64-proxy-udp-flow
          path: dist/sing-box-linux-amd64
          if-no-files-found: error
