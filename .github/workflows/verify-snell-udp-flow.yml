name: Verify proxy UDP flow adapters

on:
  workflow_dispatch:
  push:
    paths:
      - "common/udpflow/**"
      - "option/snell.go"
      - "option/vless.go"
      - "protocol/snell/**"
      - "protocol/vless/**"
      - "transport/v2ray/**"
      - "transport/v2raygrpc/**"
      - "transport/v2raygrpclite/**"
      - "transport/v2rayhttp/**"
      - "transport/v2rayhttpupgrade/**"
      - "transport/v2rayquic/**"
      - "transport/v2raywebsocket/**"
      - "release/DEFAULT_BUILD_TAGS_OTHERS"
      - "release/LDFLAGS"
      - ".github/workflows/verify-snell-udp-flow.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "common/udpflow/**"
      - "option/snell.go"
      - "option/vless.go"
      - "protocol/snell/**"
      - "protocol/vless/**"
      - "transport/v2ray/**"
      - "transport/v2raygrpc/**"
      - "transport/v2raygrpclite/**"
      - "transport/v2rayhttp/**"
      - "transport/v2rayhttpupgrade/**"
      - "transport/v2rayquic/**"
      - "transport/v2raywebsocket/**"
      - "release/DEFAULT_BUILD_TAGS_OTHERS"
      - "release/LDFLAGS"
      - ".github/workflows/verify-snell-udp-flow.yml"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test UDP flow adapters with race detection
        run: go test -race -count=1 ./common/udpflow ./protocol/snell ./protocol/vless ./transport/v2ray ./transport/v2raygrpclite ./transport/v2rayhttp

      - name: Test with gVisor, full gRPC, and QUIC enabled
        run: go test -race -tags with_gvisor,with_grpc,with_quic -count=1 ./common/udpflow ./protocol/snell ./protocol/vless ./transport/v2ray ./transport/v2raygrpclite ./transport/v2rayhttp ./transport/v2rayquic

      - name: Build Linux amd64 with release features (without Naive)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=udpflow-${GITHUB_SHA::7} $(cat release/LDFLAGS) -s -w -buildid=" \
            -o dist/sing-box-linux-amd64 ./cmd/sing-box
          ./dist/sing-box-linux-amd64 version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64-proxy-udp-flow-go-${{ matrix.go }}
          path: dist/sing-box-linux-amd64
          if-no-files-found: error
