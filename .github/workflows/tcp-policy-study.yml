name: TCP connection policy verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check format, cancellation and exclusive ownership
        run: |
          test -z "$(gofmt -l common/preconnect third_party/sing-snell/internal/reuse third_party/sing-snell/snellv6/client.go third_party/sing-snell/snellv6/reuse.go)"
          go test -race -count=20 -timeout=180s ./common/preconnect
          go -C third_party/sing-snell test -race -count=10 -timeout=180s ./internal/reuse ./snellv6
          go test -race -count=3 -timeout=180s ./protocol/snell
          go test ./option
          sh .github/check_local_patches.sh
