name: Snell shared receive study
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Prepare isolated shared-buffer dependency
        run: |
          python3 .github/readpath-study/prepare.py
          go -C third_party/sing-snell mod edit -require=github.com/sagernet/sing@v0.9.7-0.20260929150544-6f21f2425a95
          python3 .github/readpath-study/prepare_shared.py
          gofmt -w third_party/sing-snell/snellv6/readpath*test.go
          go -C third_party/sing-snell mod tidy
      - name: Ownership, protocol, cancellation, and race tests
        run: |
          set -o pipefail
          go -C .study-deps/sing test -race -count=3 ./common/buf | tee shared-buffer-tests.txt
          go -C third_party/sing-snell test -tags=shared_receive_study -race -count=3 -timeout=180s ./... | tee protocol-tests.txt
          go -C third_party/sing-snell test -tags=shared_receive_study -run '^TestStudyShared' -v ./snellv6 | tee retention-tests.txt
      - name: Same-host comparison
        run: |
          set -o pipefail
          go -C third_party/sing-snell test -tags=shared_receive_study ./snellv6 -run '^$' -bench '^BenchmarkStudyShapedRead$/(memory|tcp)/.+/(baseline|combined|coalesced_buffered|shared)$' -benchmem -benchtime=150ms -count=3 | tee shared-bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-receive-${{ matrix.os }}
          path: |
            *tests.txt
            shared-bench.txt
            third_party/sing-snell/snellv6/readpath_shared*test.go
            .study-deps/sing/common/buf/shared_buffer*.go
          include-hidden-files: true
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Build shared prototype and unchanged dependency control
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          python3 .github/readpath-study/prepare.py
          go -C third_party/sing-snell mod edit -require=github.com/sagernet/sing@v0.9.7-0.20260929150544-6f21f2425a95
          go -C third_party/sing-snell mod tidy
          gofmt -w third_party/sing-snell/snellv6/readpath*test.go
          export CC="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go -C third_party/sing-snell test -c ./snellv6 -ldflags='-s -w' -o "$PWD/snell-control-arm64"
          python3 .github/readpath-study/prepare_shared.py
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 go -C third_party/sing-snell test -tags=shared_receive_study -c ./snellv6 -ldflags='-s -w' -o "$PWD/snell-shared-arm64"
          sha256sum snell-*-arm64 > SHA256SUMS
          git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-receive-android-arm64
          path: |
            snell-*-arm64
            SHA256SUMS
            source-commit.txt
          compression-level: 0
