name: Android ARM64

on:
  push:
    branches: [udpflow]
  pull_request:
    branches: [udpflow]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: 1.26.7

jobs:
  check:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test all core packages with release features
        run: go test -exec sudo -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" -ldflags "$(cat release/LDFLAGS)" ./...
      - name: Vet all core packages
        # The daemon/libbox debug crash hooks intentionally dereference zero.
        run: go vet -unsafeptr=false -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" ./...
      - name: Race tests with the Android gRPC implementation
        run: go test -race -tags with_gvisor,with_quic -count=1 ./common/udpflow ./protocol/snell ./protocol/vless ./transport/v2ray ./transport/v2raywebsocket ./transport/v2raygrpclite ./transport/v2rayhttp ./transport/v2rayquic github.com/sagernet/sing-mux
      - name: Race tests with full gRPC
        run: go test -race -tags with_gvisor,with_grpc,with_quic -count=1 ./common/udpflow ./protocol/vless ./transport/v2ray ./transport/v2raywebsocket ./transport/v2raygrpclite ./transport/v2rayhttp ./transport/v2rayquic
      - name: Measure UDP forwarding allocations and throughput
        run: |
          go test -tags with_gvisor -run '^$' -bench '^BenchmarkPortForward$' -benchmem ./common/udpflow | tee "$RUNNER_TEMP/udpflow-bench.txt"
          {
            echo '```text'
            cat "$RUNNER_TEMP/udpflow-bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build signed ARM64 APK
    needs: check
    if: github.ref == 'refs/heads/udpflow' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Checkout the pinned Android client
        run: git submodule update --init --recursive clients/android
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache native Go builds and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-arm64-go-${{ env.GO_VERSION }}-ndk-r28-${{ hashFiles('go.sum', 'third_party/sing-mux/go.sum') }}-${{ github.sha }}
          restore-keys: android-arm64-go-${{ env.GO_VERSION }}-ndk-r28-${{ hashFiles('go.sum', 'third_party/sing-mux/go.sum') }}-
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
      - name: Set snapshot version
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          path = Path("clients/android/version.properties")
          props = dict(line.split("=", 1) for line in path.read_text().splitlines() if "=" in line)
          props["VERSION_NAME"] += "-udpflow.g" + os.environ["GITHUB_SHA"][:7]
          # Runs increase independently of the pinned client's VERSION_CODE;
          # retrying a run keeps its version code unchanged.
          props["VERSION_CODE"] = str(1000000 + int(os.environ["GITHUB_RUN_NUMBER"]))
          props["GO_VERSION"] = "go" + os.environ["GO_VERSION"]
          path.write_text("".join(f"{key}={value}\n" for key, value in props.items()))
          subprocess.run(["git", "tag", "v" + props["VERSION_NAME"]], check=True)
          PY
      - name: Build API 24 ARM64 library with Naive
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -android-legacy=false
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > clients/android/app/release.keystore
          chmod 600 clients/android/app/release.keystore
      - name: Build APK
        working-directory: clients/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew --build-cache --parallel --init-script ../../.github/android-arm64.init.gradle :app:assembleOtherRelease
      - name: Verify APK and record its sources
        run: python3 .github/verify_android_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: binary-android-arm64
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
