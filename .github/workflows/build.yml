name: Android ARM64

on:
  push:
    branches: [udpflow-testing]
  pull_request:
    branches: [udpflow-testing]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Select pinned testing snapshot
    if: github.repository == 'shinokiri/sing-box'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.source.outputs.build }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Test release selection, upstream merges and APK verification
        run: python3 -m unittest discover -s .github -p 'test_*.py' -v
      - name: Select reviewed snapshot
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/udpflow_testing_release.py plan

  build:
    name: Test, build and release ARM64
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_ANDROID: ${{ github.ref == 'refs/heads/udpflow-testing' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Prepare exact upstream and Android sources
        id: source
        env:
          PUBLISH_RELEASE: ${{ needs.plan.outputs.publish }}
        run: python3 .github/udpflow_testing_release.py prepare
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.source.outputs.go_version }}
          cache: false
      - name: Cache native Go builds and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: android-arm64-api36-go-${{ steps.source.outputs.go_version }}-ndk-r29-${{ hashFiles('go.sum', 'third_party/sing-mux/go.sum', 'third_party/sing-tun/go.sum') }}-${{ github.sha }}
          restore-keys: |
            android-arm64-api36-go-${{ steps.source.outputs.go_version }}-ndk-r29-${{ hashFiles('go.sum', 'third_party/sing-mux/go.sum', 'third_party/sing-tun/go.sum') }}-
            android-arm64-api36-go-${{ steps.source.outputs.go_version }}-ndk-r29-
      - name: Check local patches against both module requirements
        run: sh .github/check_local_patches.sh
      - name: Test all core packages with release features
        run: go test -exec sudo -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" -ldflags "$(cat release/LDFLAGS)" ./...
      - name: Vet all core packages
        # The daemon/libbox debug crash hooks intentionally dereference zero.
        run: go vet -unsafeptr=false -tags "$(cat release/DEFAULT_BUILD_TAGS_OTHERS)" ./...
      - name: Race tests for FakeIP recovery and buffered writes
        run: go test -race -count=3 ./experimental/cachefile ./dns/transport/fakeip
      - name: Race tests for FakeIP reset interleavings
        run: python3 .github/check_fakeip_interleavings.py --race --count=3
      - name: Test the Go TUN stack against the Linux kernel
        run: go test -exec sudo -tags with_gvisor github.com/sagernet/sing-tun
      - name: Race tests with the Android gRPC implementation
        run: go test -race -exec sudo -skip '^TestGoKernel' -tags with_gvisor,with_quic -count=1 ./route ./common/udpflow ./protocol/group ./protocol/snell ./protocol/vless ./transport/v2ray ./transport/v2raywebsocket ./transport/v2raygrpclite ./transport/v2rayhttp ./transport/v2rayquic github.com/sagernet/sing-mux github.com/sagernet/sing-tun
      - name: Race tests with full gRPC
        run: go test -race -exec sudo -skip '^TestGoKernel' -tags with_gvisor,with_grpc,with_quic -count=1 ./route ./common/udpflow ./protocol/group ./protocol/vless ./transport/v2ray ./transport/v2raywebsocket ./transport/v2raygrpclite ./transport/v2rayhttp ./transport/v2rayquic github.com/sagernet/sing-tun
      - name: Measure UDP forwarding and FakeIP cache lookups
        run: |
          set -o pipefail
          go test -tags with_gvisor -run '^$' -bench '^Benchmark(Port|Dispatcher)Forward$' -benchmem ./common/udpflow | tee "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkUDPMappingHistory$' -benchmem github.com/sagernet/sing-tun | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPLoadDomain$' -benchmem ./experimental/cachefile | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPMixed$' -benchmem -cpu=4 ./experimental/cachefile | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPAdmin$' -benchtime=20x -benchmem ./experimental/cachefile | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPMiss$' -benchmem ./experimental/cachefile | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPCreateBeforeFirstFlush$' -benchtime=4096x -benchmem -cpu=1 ./dns/transport/fakeip | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPWriteTransaction$' -benchtime=250ms -benchmem -cpu=1 ./experimental/cachefile | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          go test -run '^$' -bench '^BenchmarkFakeIPFlush(Fresh)?$' -benchtime=15x -benchmem -cpu=1 ./experimental/cachefile | tee -a "$RUNNER_TEMP/udpflow-bench.txt"
          {
            echo '```text'
            cat "$RUNNER_TEMP/udpflow-bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Android NDK
        if: env.BUILD_ANDROID == 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: env.BUILD_ANDROID == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: env.BUILD_ANDROID == 'true'
        with:
          cache-provider: basic
      - name: Build Android 16 ARM64 library with Naive
        if: env.BUILD_ANDROID == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
      - name: Install signing key
        if: env.BUILD_ANDROID == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > clients/android/app/release.keystore
          chmod 600 clients/android/app/release.keystore
      - name: Test client updates and build APK
        if: env.BUILD_ANDROID == 'true'
        working-directory: clients/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: ./gradlew --build-cache --parallel --init-script ../../.github/android-arm64.init.gradle :app:testOtherReleaseUnitTest :app:assembleOtherRelease
      - name: Verify APK and record its sources
        if: env.BUILD_ANDROID == 'true'
        run: python3 .github/verify_android_apk.py
      - uses: actions/upload-artifact@v4
        if: env.BUILD_ANDROID == 'true'
        with:
          name: binary-android-arm64
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
      - name: Publish the tested development snapshot
        if: env.BUILD_ANDROID == 'true' && needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/udpflow_testing_release.py publish
