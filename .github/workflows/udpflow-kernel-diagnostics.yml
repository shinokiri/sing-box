name: UDP flow kernel diagnostics

on:
  push:
    branches: [codex/udpflow-alpha4-kernel-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Kernel regression (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: half-close
            selector: '^TestGoKernelZeroWindowHalfClose$'
          - case: flow-control
            selector: '^TestGoKernelFlowControl$/^mtu=65535/'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Repeat the kernel cases with diagnostics
        run: go test -v -count=20 -timeout=12m -exec sudo -tags with_gvisor -run '${{ matrix.selector }}' github.com/sagernet/sing-tun
