name: WFC DNS context regression

on:
  push:
    branches:
      - codex/wfc-dns-tfo-context-20260916

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26'
          cache: true
      - name: Format fixture
        run: gofmt -w dns/transport/snell_tfo_test.go dns/transport/conn_pool_context_test.go dns/transport/conn_pool.go
      - name: Exercise UDP DNS over real Snell and lazy TFO
        shell: bash
        run: |
          set -o pipefail
          go test -race -v -count=10 -timeout=120s ./dns/transport -run '^Test(UDPOverSnellTFODialContext|ConnPoolDialContextRetirement|ConnPoolResetCancelsPendingDial)$' 2>&1 | tee dns-context-test.log
      - name: DNS and dialer regression checks
        run: |
          go test -race -count=1 -timeout=180s ./dns/... ./common/dialer
          go vet ./dns/transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wfc-dns-context-regression
          path: |
            dns-context-test.log
            dns/transport/snell_tfo_test.go
            dns/transport/conn_pool_context_test.go
            dns/transport/conn_pool.go
