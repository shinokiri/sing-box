name: TUN timeout diagnosis

on:
  push:
    branches: [diagnose/tun-timeouts]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Stress the final fixture, run race checks, and disable reneging recovery
        run: python3 .github/diagnose_tun_timeouts.py
      - name: Preserve every result, including expected diagnostic failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tun-timeout-diagnosis
          path: diagnostic-results/
          if-no-files-found: error
