// Limit this invocation to one ARM64 APK, including native dependencies.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin("com.android.application") {
        project.extensions.getByName("androidComponents").finalizeDsl { android ->
            android.splits.abi.setEnable(false)
            android.defaultConfig.ndk.abiFilters.clear()
            android.defaultConfig.ndk.abiFilters.add("arm64-v8a")
            android.sourceSets.getByName("test").java.srcDir(new File(project.rootDir, "../../.github/android-tests"))
        }
        project.dependencies.add("testImplementation", "junit:junit:4.13.2")
    }
}
